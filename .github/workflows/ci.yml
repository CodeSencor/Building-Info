name: Java CI
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests
          mvn -B package

      - name: Generate Javadoc
        run: mvn javadoc:javadoc

      - name: Upload Javadoc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: target/reports/apidocs

      - name: Get project version from POM
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: 'Automated release of fat JAR'
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/BuildingInfo-${{ steps.get_version.outputs.version }}.jar
          asset_name: BuildingInfo-${{ steps.get_version.outputs.version }}.jar
          asset_content_type: application/java-archive

  deploy-pages:
    needs: build                          
    runs-on: ubuntu-latest
    permissions:                          
      pages: write                        
      id-token: write                     
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Javadoc artifact
        uses: actions/download-artifact@v4
        with:
          name: javadoc

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: javadoc

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
